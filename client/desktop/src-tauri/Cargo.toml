[package]
name = "dingdong-desktop"
version = "1.3.0"
description = "叮咚跨平台消息推送客户端"
authors = ["jarvy"]
edition = "2021"

[lib]
name = "dingdong_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 开发机内存有限：关闭 dev 调试信息（windows-rs 等超大 crate 在 debuginfo 下易使 rustc 爆栈/内存耗尽）
[profile.dev]
debug = 0
incremental = true
