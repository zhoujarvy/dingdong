# ============================================================
# 叮咚消息推送系统 · Nginx 站点配置
# 适用：Windows / Linux 均可，路径请按实际部署调整
# 用法：放入 nginx conf.d/ 或 include 到 nginx.conf 的 http{} 内
# 架构：Nginx (80) ── 静态文件直出 + /api /ws /t /m /download 反代到 uvicorn(127.0.0.1:8000)
# ============================================================

server {
    listen       80;
    server_name  _;                      # 生产环境可改为内网域名或 IP

    # ---------- 上游后端（FastAPI/uvicorn，由 NSSM 守护） ----------
    # WebSocket 需要显式升级头；反代路径与后端路由一一对应
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（客户端长连接 / 心跳）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;          # 大于心跳周期(30s)即可，避免被掐断
        proxy_send_timeout 300s;
    }

    # ---------- （可选进阶）静态文件由 Nginx 直出，减轻后端负担 ----------
    # 若启用以下 location，请注释掉上面 location / 中的静态部分或保持反代均可；
    # 二选一即可，最简单的部署是只保留上面的全量反代。
    #
    #location /assets/ {
    #    alias D:/dingdong/server/static/assets/;
    #    expires 7d;
    #}
    #location = /admin {
    #    alias D:/dingdong/server/static/;
    #    try_files /index.html =404;
    #}
    #location /download/ {
    #    alias D:/dingdong/server/site/downloads/;
    #}

    # ---------- 访问日志 ----------
    access_log logs/dingdong_access.log;
    error_log  logs/dingdong_error.log warn;

    # 客户端安装包约 2MB+，放宽上传/下载限制（默认已足够，留作提醒）
    client_max_body_size 10m;
}
